; Cấu hình tool tạo file upload STM.
; Sửa file này rồi chạy lại tool là có hiệu lực ngay, không cần cài lại.
; Xóa file này thì tool tự dùng giá trị mặc định.

[gio]
; SAP không có giờ thật cho ETD/ETA (cả 3 cột "Planned Time of..." đều 00:00:00).
; 8 và 16 là quy ước. Khách chốt giờ khác thì sửa hai dòng dưới.
etd_cong_gio = 8
eta_cong_gio = 16

[ngay]
; Cột trong file SO dùng làm nguồn cho 3 cột ngày (Ngày gửi y/c, ETD, ETA).
nguon = Planned Pick Date

[ghi_chu]
; Cụm từ để nhận ra ghi chú giao hàng lẫn trong ô địa chỉ -> cắt khỏi cột Địa chỉ.
; Mỗi dòng một cụm, phải thụt đầu dòng. Nên dùng cụm 2 từ trở lên:
; từ đơn dễ cắt nhầm tên địa danh ("Xã Giao Thủy", "Kho Thành Đạt").
cum_tu =
    gọi khách
    xác nhận
    nhận hàng
    lấy hàng
    xuống kho
    trước khi giao
    liên hệ
    vui lòng
    khách book
    báo trước
    lh:
    lưu ý
    ghi chú

[dia_chi]
; Thứ tự các cột trong file DO được ghép thành ô "Địa chỉ".
; Cố ý KHÔNG có "c/o name" vì cột đó chứa tên người nhận và số điện thoại.
cot = House No., Street, Street 2, Street 3, Street 4, Street 5, City

[stm]
; Tính năng Sold-to/Ship-to (đổi hướng 14/10/2026): tool KHÔNG gọi mạng/API nữa. Tool chỉ so khớp
; với cache local (data/stm_cache.json, nạp 1 lần bằng scripts/seed_stm_cache.py chạy tay trên máy
; có mạng thật + token thật) để tái dùng Ship-to đã có sẵn; điểm giao hoàn toàn mới -> tool tự suy
; luận ĐVHC cũ bằng chữ (không qua Goong) và xuất ra file upload_soldto_shipto_*.xlsx riêng để
; khách/admin tự import tay qua UI Import Excel có sẵn của STM.
; bat = khong -> tắt hẳn bước này, tool quay lại hành vi cũ (để trống ô Ship to thiếu, không cache
; không xuất file gì).
bat = co

[trackasia]
; Tra toạ độ (Kinh độ/Vĩ độ) khi đề xuất tạo Ship-to MỚI (nút "3. Tạo file Sold-to/Ship-to trên
; STM") - KHÔNG dùng cho toàn bộ địa chỉ như Goong trước đây, chỉ gọi khi thật sự cần tạo điểm
; mới (số lượng nhỏ mỗi lần chạy). Track Asia là nhà cung cấp CHÍNH - gọi được ngay, không cần
; đăng ký. Không tra được (mạng lỗi/key bị chặn) -> tool tự rơi xuống Nominatim (OpenStreetMap,
; không cần key, xem nominatim_api.py) làm phương án cuối. Cả 2 đều không tra được toạ độ ->
; tool KHÔNG tạo Ship-to qua file Excel nữa, để nguyên địa chỉ trong file upload đơn hàng cho
; STM tự tạo điểm (không toạ độ) lúc xử lý đơn.
; key mặc định là key dùng chung công khai trên trang playground của Track Asia - có thể bị giới
; hạn/chặn bất ngờ vì không có SLA. Khách có tài khoản riêng (track-asia.com) thì điền key vào đây.
key = public_key

; 16/10/2026: khi suy luận ĐVHC cũ bằng chữ (bước "2. Chạy") gặp Quận/Huyện trùng tên ở nhiều
; nơi mà không lọc được còn 1 (vd phường mới "X" tồn tại ở cả 2 huyện khác nhau), tool gọi thêm
; Track Asia 1 lần để PHÂN XỬ giữa các ứng viên đã suy ra sẵn - CHỈ chấp nhận nếu geocode khớp
; ĐÚNG 1 trong các ứng viên đó, không tự ý tin geocode (khác hẳn Goong cũ đã bỏ). Đo trên data
; thật: giảm nhóm "Quận/Huyện trùng tên" từ 46 xuống 5/295 đơn. Không tra được (mạng lỗi/key bị
; chặn) -> tự rơi về mơ hồ như trước, không crash.
; go_mo_ho_quan = khong -> tắt hẳn, bước "2. Chạy" quay lại hoàn toàn offline như trước 16/10/2026.
go_mo_ho_quan = co
